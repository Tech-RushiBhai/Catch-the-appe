<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catch the Apple Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Catch the Apple!</h1>
  <div id="gameArea">
    <div id="basket"></div>
    <div class="apple"></div>
  </div>

  <div class="controls">
    <button onclick="moveLeft()">◀ Left</button>
    <button onclick="moveRight()">Right ▶</button>
  </div>

  <p class="score-display">Score: <span id="score">0</span></p>

  <script src="script.js"></script>
</body>
</html>
